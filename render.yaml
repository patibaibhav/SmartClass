services:
  - type: web
    name: smartclass-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: python -m alembic -c backend/alembic.ini upgrade head
    startCommand: python -m uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_BACKEND
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: smartclass-materials
      - key: DATABASE_SSLMODE
        value: verify-full
      - key: MAX_UPLOAD_BYTES
        value: "10485760"

